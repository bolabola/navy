name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 先构建前端（dist/），再在 workerd 中运行 Vitest（含 Durable Object / 静态资源集成测试）
      - run: npm test

  # 推送到 master 且测试通过后自动部署。
  # 需要在仓库 Settings → Secrets and variables → Actions 中添加 CLOUDFLARE_API_TOKEN
  # （多账号时再添加 CLOUDFLARE_ACCOUNT_ID；Worker 名不是 wrangler.toml 里的 navy 时再添加变量 WORKER_NAME）。
  # 没有配置 token 时这个任务会跳过部署步骤，fork 不受影响。
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 可选：仓库变量 WORKER_NAME，用来部署到 wrangler.toml 以外的 Worker 名
      NAVY_WORKER_NAME: ${{ vars.WORKER_NAME }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
