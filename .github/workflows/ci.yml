name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 先构建前端（dist/），再在 workerd 中运行 Vitest（含 Durable Object / 静态资源集成测试）
      - run: npm test
