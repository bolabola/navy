name = "navy"
main = "worker/src/index.ts"
compatibility_date = "2026-01-01"

# 前端构建：wrangler dev / deploy 前自动执行，输出到 dist/
[build]
command = "node scripts/build.mjs"
watch_dir = "frontend"

# Static frontend assets — Workers Static Assets 自动响应非 /api/* 请求
[assets]
directory = "./dist"
binding = "ASSETS"

# 每小时检查一次，看板有变化时备份到已连接的 Google Drive / Dropbox
[triggers]
crons = ["17 * * * *"]

# 会话、登录限流、云备份配置和看板只读镜像。
# 不需要填 id：首次部署时 Wrangler 会自动创建，之后的部署沿用已绑定的命名空间。
[[kv_namespaces]]
binding = "BOARD_KV"

# 看板状态的权威存储（强一致）。KV 中的 state 作为只读镜像供匿名访客快速读取。
[[durable_objects.bindings]]
name = "BOARD_STATE"
class_name = "BoardStateObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardStateObject"]
