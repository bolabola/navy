name = "board-trello"
main = "worker/src/index.ts"
compatibility_date = "2026-01-01"

# Static frontend assets — Workers Static Assets 自动响应非 /api/* 请求
[assets]
directory = "./src"
binding = "ASSETS"

# 每小时检查一次，看板有变化时备份到已连接的 Google Drive / Dropbox
[triggers]
crons = ["17 * * * *"]

# KV namespace for board state. id 在首次部署前用 `npx wrangler kv namespace create BOARD_KV` 创建后填入
[[kv_namespaces]]
binding = "BOARD_KV"
id = "REPLACE_WITH_KV_ID"

# 看板状态的权威存储（强一致）。KV 中的 state 作为只读镜像供匿名访客快速读取。
[[durable_objects.bindings]]
name = "BOARD_STATE"
class_name = "BoardStateObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardStateObject"]
